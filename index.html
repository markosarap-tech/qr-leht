<title>Nav + muusika</title>

<script>
let audioStarted = false;
let audio;

function startAll() {
  // Maps
  window.location.href =
    "https://www.google.com/maps/dir/?api=1&origin=Tartu+M%C3%A4nguasjamuuseum,+Tartu&destination=Jakobi+19,+Tartu";

  // Muusika
  if (!audioStarted) {
    audio = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");
    audio.loop = true;
    audio.play().catch(() => {});
    audioStarted = true;
  }
}
</script>
