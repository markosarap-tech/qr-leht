<title>Marsruut + muusika</title>

<script>
let audio;

function startAll() {
  // 🎵 sinu GitHubi lugu
  audio = new Audio("https://raw.githubusercontent.com/markosarap-tech/qr-leht/refs/heads/main/muusika.mp4");
  audio.loop = true;
  audio.volume = 0.8;

  audio.play().catch(() => {
    console.log("Brauser blokeeris autoplay");
  });

  // 📍 Maps
  window.location.href =
    "https://www.google.com/maps/dir/?api=1&destination=https://maps.app.goo.gl/Kux3EBY44kG2mHQD7&travelmode=walking
";
}
</script>
